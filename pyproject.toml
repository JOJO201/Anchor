[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchoradd"
version = "0.1.0"
description = "Anchor-based multi-view learning for robust audio deepfake detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[project.optional-dependencies]
example = [
  "PyYAML>=6.0",
  "scipy>=1.10",
  "soundfile>=0.12",
  "tqdm>=4.66",
]
dev = [
  "PyYAML>=6.0",
  "pytest>=7.4",
  "scipy>=1.10",
  "soundfile>=0.12",
  "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py310"
